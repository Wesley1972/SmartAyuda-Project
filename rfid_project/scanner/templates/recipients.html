<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAyuda - Distribution Report</title>

    <style>
        /* Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }

        .dashboard-container {
            max-width: 900px; /* Slightly widened to accommodate the new column */
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* Top Header */
        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }

        .header h1 {
            color: #007bff;
            font-size: 2.5em;
            margin: 0;
        }

        /* Summary Info Card */
        .summary-card {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .summary-card p {
            margin: 10px 0;
            font-size: 1.1em;
            color: #444;
        }

        .summary-card strong {
            color: #007bff;
            display: inline-block;
            width: 180px;
        }

        /* Recipient Table */
        h3 {
            color: #333;
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: white;
            font-weight: 500;
        }

        tr:hover {
            background-color: #f8f9fa;
        }

        .address-text {
            color: #555;
            font-size: 0.95em;
        }

        .supplies-text {
            color: #666;
            font-size: 0.9em;
        }

        /* Utilities */
        .close-btn {
            background-color: #6c757d;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .close-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Close Button (Useful if opened in a new tab) -->
        <button class="close-btn" onclick="window.location.href='admin_portal.html'">← Close Report</button>

        <div class="header">
            <h1>Distribution Report</h1>
        </div>

        <!-- Session Summary Details -->
        <div class="summary-card">
            <p><strong>Date:</strong> <span id="report-date">Loading...</span></p>
            <p><strong>Location:</strong> <span id="report-location">Loading...</span></p>
            <p><strong>Supplies Distributed:</strong> <span id="report-supplies">Loading...</span></p>
            <p><strong>Total Recipients:</strong> <span id="report-total" style="font-weight: bold; color: #28a745;">0</span></p>
        </div>

        <!-- Recipient List Table -->
        <h3>Recipient List</h3>
        <table>
            <thead>
                <tr>
                    <th style="width: 5%;">#</th>
                    <th style="width: 25%;">Name</th>
                    <th style="width: 30%;">Address</th>
                    <th style="width: 15%;">Time Received</th>
                </tr>
            </thead>
            <tbody id="recipient-list">
            </tbody>
        </table>
    </div>

    <script>
        const headerDateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };

        // 1. Grab the log_id from the URL (e.g., recipients.html?log_id=5)
        const urlParams = new URLSearchParams(window.location.search);
        const logId = urlParams.get('log_id');

        if (logId) {
            fetch(`/api/get_recipients/?log_id=${logId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        const logDate = new Date(data.timestamp);
                        const dateString = logDate.toLocaleDateString('en-US', headerDateOptions);
                        const timeString = logDate.toLocaleTimeString('en-US', timeOptions);

                        // 2. Fill in the Summary Card at the top
                        document.getElementById('report-date').innerText = dateString;
                        document.getElementById('report-location').innerText = data.location;
                        document.getElementById('report-supplies').innerText = data.supplies;
                        document.getElementById('report-total').innerText = data.total_recipients;

                        // 3. Populate the Recipient List Table
                        const tbody = document.getElementById('recipient-list');
                        tbody.innerHTML = '';

                        if (data.recipients.length === 0) {
                            tbody.innerHTML = `
                                <tr>
                                    <td colspan="5" style="text-align: center; color: #888;">
                                        <em>No recipients have received this supply yet.</em>
                                    </td>
                                </tr>
                            `;
                        } else {
                            data.recipients.forEach((person, index) => {
                                const personDate = new Date(person.time_received);
                                const personTimeString = personDate.toLocaleTimeString('en-US', timeOptions);

                                const rowHTML = `
                                    <tr>
                                        <td>${index + 1}</td>
                                        <td><strong>${person.full_name}</strong></td>
                                        <td class="address-text">${person.address}</td>
                                        <td>${personTimeString}</td>
                                    </tr>
                                `;
                                tbody.insertAdjacentHTML('beforeend', rowHTML);
                            });
                        }
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(error => console.error('Error fetching recipients:', error));
        } else {
            document.getElementById('recipient-list').innerHTML = `
                <tr>
                    <td colspan="5" style="text-align: center; color: #dc3545;">
                        <em>No supply record selected. Please open this page from the Admin Portal.</em>
                    </td>
                </tr>
            `;
        }
    </script>

</body>
</html>
