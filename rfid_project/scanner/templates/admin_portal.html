<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAyuda - Relief Distribution Desk</title>

    <style>
        /* Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }

        .dashboard-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 15px;
        }

        .header h1 {
            color: #007bff;
            font-size: 2.5em;
            margin: 0;
        }

        /* --- Scanner Banner Styles --- */
        .scanner-banner {
            background-color: #f8f9fa;
            border: 2px dashed #007bff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .scanner-banner.linked {
            border: 2px solid #28a745;
            background-color: #d4edda;
        }




        .scanner-banner.unlinked {
            border: 2px solid #dc3545;
            background-color: #f8d7da;
        }

        .scanner-banner.duplicate-error {
            border: 2px solid #dc3545;
            background-color: #f8d7da;
            animation: blinkRedBanner 0.4s ease-in-out 5;
        }

        .status-dot.error-light {
            background-color: #dc3545;
            box-shadow: 0 0 10px rgba(220, 53, 69, 0.9);
            animation: blinkRedLight 0.4s ease-in-out 5;
        }

        @keyframes blinkRedBanner {
            0%, 100% {
                background-color: #f8d7da;
                border-color: #dc3545;
                box-shadow: 0 0 0 rgba(220, 53, 69, 0);
            }
            50% {
                background-color: #ff4d4d;
                border-color: #a71d2a;
                box-shadow: 0 0 20px rgba(220, 53, 69, 0.9);
            }
        }

        @keyframes blinkRedLight {
            0%, 100% {
                opacity: 1;
                box-shadow: 0 0 12px 4px rgba(220, 53, 69, 0.95);
            }
            50% {
                opacity: 0.1;
                box-shadow: 0 0 0 0 rgba(220, 53, 69, 0);
            }
        }





        .scanner-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin: 0 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-details {
            font-size: 1.1em;
            color: #555;
            margin: 0;
        }

        .status-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #007bff;
            border-radius: 50%;
            margin-right: 10px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 123, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 123, 255, 0); }
        }

        .register-btn {
            background-color: #dc3545;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            display: none;
        }

        .register-btn:hover {
            background-color: #c82333;
        }

        .edit-btn {
            background-color: #ffc107;
            color: #333;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            margin-top: 10px;
            display: none;
        }

        .edit-btn:hover {
            background-color: #e0a800;
        }

        /* Testing Buttons */
        .dev-buttons {
            text-align: center;
            margin-bottom: 30px;
        }

        .dev-buttons button {
            padding: 8px 15px;
            margin: 0 5px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #eee;
            font-size: 0.9em;

        }

        .dev-buttons button:hover {
            background: #ddd;
        }
        /*-----------------------------------------------------------------------------------------*/
        .dev-buttons button.active-assign {
            background-color: #28a745;
            color: white;
            border-color: #28a745;
            font-weight: bold;
        }

        .dev-buttons button.active-assign:hover {
            background-color: #218838;
        }
        /*-----------------------------------------------------------------------------------------*/

        /* Form Styles */
        .date-display {
            text-align: center;
            font-size: 1.2em;
            color: #666;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* Location Input Style */
        .input-single {
            display: flex;
            margin-bottom: 15px;
        }

        .input-single input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-single input:focus {
            border-color: #007bff;
        }

        .input-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .input-group input {
            flex: 1;
            padding: 15px 20px;
            font-size: 1.1em;
            border: 2px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: #007bff;
        }

        .input-group button {
            background: #28a745;
            color: white;
            padding: 0 30px;
            font-size: 1.1em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .input-group button:hover {
            background: #218838;
        }

        /* History Log Section */
        .history-section {
            margin-top: 40px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }

        .history-section h3 {
            color: #333;
            margin-top: 0;
            margin-bottom: 15px;
        }

        /* List Styling for History */
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .history-item {
            background-color: #f8f9fa;
            border-left: 4px solid #007bff;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .history-text {
            font-size: 1.1em;
            font-weight: bold;
            color: #333;
            margin: 0;
        }

        .history-location {
            font-size: 0.95em;
            color: #007bff;
            font-weight: 500;
            margin: 5px 0 0 0;
        }

        .history-time {
            font-size: 0.9em;
            color: #666;
            margin: 5px 0 0 0;
            font-style: italic;
        }

        /* Updated Actions to Stack Vertically */
        .history-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .history-edit-btn {
            background-color: #ffc107;
            color: #333;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
        }

        .history-edit-btn:hover {
            background-color: #e0a800;
        }

        /* NEW: Styles for the Recipient Counter Button */
        .recipient-count-btn {
            font-size: 0.85em;
            color: #17a2b8;
            font-weight: 600;
            background-color: #e9ecef;
            padding: 5px 10px;
            border: 1px solid #17a2b8;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .recipient-count-btn:hover {
            background-color: #17a2b8;
            color: white;
        }
    </style>

</head>

<body>

    <div class="dashboard-container">
        <div class="header">
            <p id="admin-name-display" style="color: #555; font-size: 1.2em; font-weight: bold; margin: 0 0 8px 0;">
                Admin:
            </p>
            <h1>Relief Distribution Desk</h1>
        </div>

        <!-- --- Scanner Status Banner --- -->
        <div class="scanner-banner" id="scanner-banner">
            <h3 class="scanner-title" id="scanner-title">
                <span class="status-dot" id="status-dot"></span> Waiting for Card Scan...
            </h3>
            <p class="scanner-details" id="scanner-details">Tap an RFID card to verify link status.</p>
            <!-- Updated Buttons with URL Parameters -->
            <button class="register-btn" id="register-btn" onclick="window.location.href='save_user.html?action=register'">Register Card</button>
            <button class="edit-btn" id="edit-btn" onclick="window.location.href='edit_user.html?action=edit'">Edit Details</button>
        </div>

        <!-- --- Dev Testing Buttons --- -->
        <div class="dev-buttons">
            <button id="assign-supply-btn" onclick="activateAssignSupply()">Assign Supply</button>
            <button onclick="simulateScanLinkCard()">Simulate Linked Card</button>
            <button onclick="simulateScanUnlinkCard()">Simulate Unlinked Card</button>
            <button onclick="resetScanner()">Reset</button>
        </div>

        <!-- Auto-populated Date -->
        <div class="date-display" id="display-date"></div>

        <form id="supply-form" onsubmit="saveSupply(event)">
            <!-- Location Input -->
            <div class="input-single">
                <input type="text" id="location-input" placeholder="Enter distribution location (e.g., San Jose Covered Court)..." required>
            </div>

            <!-- Supply Input and Save Button -->
            <div class="input-group">
                <input type="text" id="supplies-input" placeholder="Enter supplies given (e.g., 5kg Rice, 2 Water)..." required>
                <button type="submit">Save</button>
            </div>
        </form>

        <!-- History Area -->
        <div class="history-section">
            <h3>Recent Saved Records</h3>
            <ul class="history-list" id="history-list">
                <li class="history-item" id="placeholder-history" style="border-left-color: #ccc; color: #888; justify-content: center; flex-direction: row;">
                    <em>No supplies logged for this session yet.</em>
                </li>
            </ul>
        </div>
    </div>

    <script>
        const headerDateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('display-date').innerText = new Date().toLocaleDateString('en-US', headerDateOptions);

        const loggedInAdmin = localStorage.getItem('adminName');
        if (loggedInAdmin) {
            document.getElementById('admin-name-display').innerText = 'Admin: ' + loggedInAdmin;
        }

        // Helper function to turn the Assign Supply button back to normal gray
        function clearAssignSupplyBtn() {
            const assignBtn = document.getElementById('assign-supply-btn');
            if (assignBtn) {
                assignBtn.classList.remove('active-assign');
                assignBtn.style.backgroundColor = '';
                assignBtn.style.color = '';
                assignBtn.style.borderColor = '';
            }
        }









        let audioCtx = null;

        function unlockAudio() {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.error('Audio initialization error:', e);
            }
        }

        function playErrorBuzzer() {
            try {
                unlockAudio();
                const now = audioCtx.currentTime;

                // 5 buzzer beeps synced with the 5 red flashes (0.4s interval)
                for (let i = 0; i < 5; i++) {
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();

                    const startTime = now + i * 0.4;
                    const stopTime = startTime + 0.22;

                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(220, startTime);

                    gainNode.gain.setValueAtTime(0.3, startTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, stopTime);

                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    oscillator.start(startTime);
                    oscillator.stop(stopTime);
                }
            } catch (e) {
                console.error('Error playing buzzer sound:', e);
            }
        }

        function activateAssignSupply() {
            unlockAudio(); // Unlocks browser audio on button click so the buzzer plays automatically on scan

            const banner = document.getElementById('scanner-banner');
            const title = document.getElementById('scanner-title');
            const details = document.getElementById('scanner-details');
            const registerBtn = document.getElementById('register-btn');
            const editBtn = document.getElementById('edit-btn');
            const assignBtn = document.getElementById('assign-supply-btn');

            // Turn the Assign Supply button green
            assignBtn.classList.add('active-assign');

            // Update scanner banner to prompt for card tap
            banner.className = 'scanner-banner';
            title.innerHTML = '<span class="status-dot" id="status-dot"></span> Tap card to assign supply';
            details.innerHTML = 'Tap a registered RFID card to assign the current supply record.';

            registerBtn.style.display = 'none';
            editBtn.style.display = 'none';
        }











        // --- Dev Testing Functions ---
        function simulateScanLinkCard() {
            const banner = document.getElementById('scanner-banner');
            const title = document.getElementById('scanner-title');
            const details = document.getElementById('scanner-details');
            const registerBtn = document.getElementById('register-btn');
            const editBtn = document.getElementById('edit-btn');

            clearAssignSupplyBtn()

            // Create a mock scanData object for the simulation
            const mockScanData = {
                name: "Juan Dela Cruz",
                uid: "A1B2C3D4"
            };

            banner.className = 'scanner-banner linked';
            title.innerHTML = '✅ Card Recognized';
            details.innerHTML = `<strong>Full name:</strong> ${mockScanData.name} <br> <small style="color: #666;">UID: ${mockScanData.uid}</small>`;

            registerBtn.style.display = 'none';
            editBtn.style.display = 'inline-block';
            editBtn.onclick = () => window.location.href = `edit_user.html?action=edit&uid=${mockScanData.uid}`;
        }

        function simulateScanUnlinkCard() {
            const banner = document.getElementById('scanner-banner');
            const title = document.getElementById('scanner-title');
            const details = document.getElementById('scanner-details');
            const registerBtn = document.getElementById('register-btn');
            const editBtn = document.getElementById('edit-btn');

            clearAssignSupplyBtn()

            // Create a mock scanData object for the simulation
            const mockScanData = {
                uid: "E5F6G7H8"
            };

            banner.className = 'scanner-banner unlinked';
            title.innerHTML = '⚠️ Unregistered Card';
            details.innerHTML = `This card is not linked to any user. Please register. <br> <small style="color: #666;">UID: ${mockScanData.uid}</small>`;

            registerBtn.style.display = 'inline-block';
            editBtn.style.display = 'none';
            registerBtn.onclick = () => window.location.href = `save_user.html?action=register&uid=${mockScanData.uid}`;
        }

        // --- Helper Function to Render a Record on Screen ---
        function renderHistoryItem(id, location, supplies, dateObj, recipientCount = 0) {
            const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
            const dateString = dateObj.toLocaleDateString('en-US', headerDateOptions);
            const timeString = dateObj.toLocaleTimeString('en-US', timeOptions);

            const placeholder = document.getElementById('placeholder-history');
            if (placeholder) {
                placeholder.remove();
            }

            const itemId = 'history-item-' + id;

            const newHistoryHTML = `
                <li class="history-item" id="${itemId}">
                    <div>
                        <p class="history-text" id="text-${itemId}">${supplies}</p>
                        <p class="history-location" id="loc-${itemId}">Location: ${location}</p>
                        <p class="history-time">Saved on: ${dateString} at ${timeString}</p>
                    </div>
                    <div class="history-actions">
<!--                        <button class="history-edit-btn" onclick="editHistoryItem('${itemId}')">Edit</button>-->
                        <button class="recipient-count-btn" id="count-${itemId}" onclick="window.open('recipients.html?log_id=${id}', '_blank')">Number of people received aid: ${recipientCount}</button>
                    </div>
                </li>
            `;

            const historyList = document.getElementById('history-list');
            historyList.insertAdjacentHTML('afterbegin', newHistoryHTML);
        }

        // --- Load Previously Saved Records on Page Refresh ---
        function loadSavedSupplies() {
            fetch('/api/get_admin_logs/')
                .then(response => response.json())
                .then(data => {
                    data.logs.forEach(log => {
                        const savedDate = new Date(log.timestamp);
                        renderHistoryItem(log.id, log.location, log.supplies, savedDate, log.recipient_count);
                    });
                })
                .catch(error => console.error('Error loading saved supplies:', error));
        }

        let editingLogId = null;

        function saveSupply(event) {
            event.preventDefault(); // Prevents the form from refreshing the page

            const location = document.getElementById('location-input').value;
            const supplies = document.getElementById('supplies-input').value;

            if (location.trim() === "" || supplies.trim() === "") {
                alert("Please fill in both the location and the supplies.");
                return;
            }

            // Send the location and supplies to Django to save in the database
            fetch('/api/save_supply/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: editingLogId,
                    location: location,
                    supplies: supplies
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    editingLogId = null;

                    const now = new Date();
                    const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
                    const dateString = now.toLocaleDateString('en-US', headerDateOptions);
                    const timeString = now.toLocaleTimeString('en-US', timeOptions);

                    const placeholder = document.getElementById('placeholder-history');
                    if (placeholder) {
                        placeholder.remove();
                    }

                    const itemId = 'history-item-' + data.id;

                    const newHistoryHTML = `
                        <li class="history-item" id="${itemId}">
                            <div>
                                <p class="history-text" id="text-${itemId}">${supplies}</p>
                                <p class="history-location" id="loc-${itemId}">Location: ${location}</p>
                                <p class="history-time">Saved on: ${dateString} at ${timeString}</p>
                            </div>
                            <div class="history-actions">
<!--                                <button class="history-edit-btn" onclick="editHistoryItem('${itemId}')">Edit</button>-->
                                <button class="recipient-count-btn" id="count-${itemId}" onclick="window.open('recipients.html?log_id=${data.id}', '_blank')">Number of people received aid: ${data.recipient_count}</button>
                            </div>
                        </li>
                    `;

                    const historyList = document.getElementById('history-list');
                    historyList.insertAdjacentHTML('afterbegin', newHistoryHTML);

                    document.getElementById('location-input').value = "";
                    document.getElementById('supplies-input').value = "";
                    document.getElementById('supplies-input').focus();
                } else {
                    alert("Database Error: " + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Network Error: Could not connect to the database.");
            });
        }

        if (loggedInAdmin) {
            loadSavedSupplies();
        }

        // --- 1. LIVE POLLING LOGIC ---
        function pollScanner() {
            fetch('/api/check_scanner/')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        updateScannerBanner(data.scan_data);
                    }
                })
                .catch(error => console.error('Error checking scanner:', error));
        }

        // Start listening to the backend automatically every 1.5 seconds
        setInterval(pollScanner, 1500);





        function updateScannerBanner(scanData) {
            const banner = document.getElementById('scanner-banner');
            const title = document.getElementById('scanner-title');
            const details = document.getElementById('scanner-details');
            const registerBtn = document.getElementById('register-btn');
            const editBtn = document.getElementById('edit-btn');
            const assignBtn = document.getElementById('assign-supply-btn');

            const isAssignMode = assignBtn && assignBtn.classList.contains('active-assign');

            banner.className = 'scanner-banner';

            if (scanData.is_linked) {
                registerBtn.style.display = 'none';
                editBtn.style.display = 'none';

                if (isAssignMode) {
                    const historyList = document.getElementById('history-list');
                    const topRecord = historyList.querySelector('.history-item:not(#placeholder-history)');

                    if (topRecord) {
                        const suppliesText = topRecord.querySelector('.history-text').innerText.trim();
                        const locationText = topRecord.querySelector('.history-location').innerText.replace('Location: ', '').trim();
                        const adminLogId = topRecord.id.replace('history-item-', '');

                        title.innerHTML = '<span class="status-dot" id="status-dot"></span> Checking Supply Record...';
                        details.innerHTML = `<strong>Full name:</strong> ${scanData.name} <br> <small style="color: #666;">UID: ${scanData.uid}</small>`;

                        // Send UID to Django to check for duplicates and attach the user
                        assignSupplyToUser(scanData.uid, suppliesText, locationText, adminLogId);
                        // Notice clearAssignSupplyBtn() is NOT called here, so the button stays green!
                    } else {
                        alert("No supplies in the Recent Saved Records to assign! Please save a supply first.");
                    }
                } else {
                    banner.classList.add('linked');
                    title.innerHTML = '✅ Card Recognized';
                    details.innerHTML = `<strong>Full name:</strong> ${scanData.name} <br> <small style="color: #666;">UID: ${scanData.uid}</small>`;
                    editBtn.style.display = 'inline-block';
                    editBtn.onclick = () => window.location.href = `edit_user.html?action=edit&uid=${scanData.uid}`;
                }
            } else {
                if (isAssignMode) {
                    clearAssignSupplyBtn();
                }
                banner.classList.add('unlinked');
                title.innerHTML = '⚠️ Unregistered Card';
                details.innerHTML = `This card is not linked to any user. Please register. <br> <small style="color: #666;">UID: ${scanData.uid}</small>`;
                registerBtn.style.display = 'inline-block';
                editBtn.style.display = 'none';
                registerBtn.onclick = () => window.location.href = `save_user.html?action=register&uid=${scanData.uid}`;
            }
        }

        function assignSupplyToUser(uid, supplies, location, adminLogId) {
            fetch('/api/assign_supply/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uid: uid,
                    supplies: supplies,
                    location: location,
                    admin_log_id: adminLogId
                })
            })
            .then(response => response.json())
            .then(data => {
                const banner = document.getElementById('scanner-banner');
                const title = document.getElementById('scanner-title');
                const details = document.getElementById('scanner-details');

                if (data.status === 'success') {
                    banner.className = 'scanner-banner linked';
                    title.innerHTML = '✅ Supply Assigned!';
                    details.innerHTML += `<br><span style="color: #28a745; font-weight: bold; display: inline-block; margin-top: 10px;">Assigned: ${supplies} (${location})</span>`;

                    const countBtn = document.getElementById(`count-history-item-${data.log_id}`);
                    if (countBtn) {
                        countBtn.innerText = `Number of people received aid: ${data.recipient_count}`;
                    }
                } else if (data.status === 'duplicate') {
                    // Reset class and force reflow so the 5-flash animation always replays on repeat taps
                    banner.className = 'scanner-banner';
                    void banner.offsetWidth;
                    banner.classList.add('duplicate-error');

                    title.innerHTML = '<span class="status-dot error-light"></span> ❌ Duplicate Claim Detected!';
                    details.innerHTML += `<br><span style="color: #a71d2a; font-weight: bold; display: inline-block; margin-top: 10px;">${data.message}</span>`;

                    playErrorBuzzer();
                } else {
                    banner.className = 'scanner-banner unlinked';
                    title.innerHTML = '❌ Assignment Failed';
                    details.innerHTML += `<br><span style="color: #a71d2a; font-weight: bold; display: inline-block; margin-top: 10px;">${data.message}</span>`;
                }
            })
            .catch(error => {
                console.error('Error assigning supply:', error);
                const banner = document.getElementById('scanner-banner');
                banner.className = 'scanner-banner unlinked';
                document.getElementById('scanner-title').innerHTML = '❌ Network Error';
                alert("Network Error: Could not link supply to user.");
            });
        }






        function resetScanner() {
            const banner = document.getElementById('scanner-banner');
            const title = document.getElementById('scanner-title');
            const details = document.getElementById('scanner-details');
            const registerBtn = document.getElementById('register-btn');
            const editBtn = document.getElementById('edit-btn');

            clearAssignSupplyBtn()

            banner.className = 'scanner-banner';
            title.innerHTML = '<span class="status-dot" id="status-dot"></span> Waiting for Card Scan...';
            details.innerHTML = 'Tap an RFID card to verify link status.';
            registerBtn.style.display = 'none';
            editBtn.style.display = 'none';
        }
