{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAyuda - RFID Attendance Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Live RFID Attendance</h1>
    </div>

    <div class="status">System Status: Active & Listening...</div>

    <table>
        <thead>
            <tr>
                <th>Date & Time</th>
                <th>RFID UID / Employee</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="log-table-body">
            <!-- JavaScript will inject the rows here dynamically -->
        </tbody>
    </table>
</div>

<script>

    function fetchLogs() { // Function to fetch data from Django and update the table
        fetch('/api/logs/') // Where do you find the '/api/logs/' at?
            .then(response => response.json())
            .then(data => {
                const tableBody = document.getElementById('log-table-body');
                tableBody.innerHTML = ''; // Clear the current table content

                data.logs.forEach(log => { // Loop through the data and create a new row for each scan
                    const row = `
                        <tr>
                            <td>${log.timestamp}</td>
                            <td><strong>${log.uid}</strong></td>
                            <td style="color: #28a745;">Success</td>
                        </tr>
                    `;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error('Error fetching logs:', error));
    }

    fetchLogs(); // Run immediately on page load

    setInterval(fetchLogs, 1500); // Set a timer to run fetchLogs() every 1500 milliseconds (1.5 seconds)
</script>

</body>
</html>
