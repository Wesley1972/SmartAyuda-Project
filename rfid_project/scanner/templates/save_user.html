<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAyuda - Register New User</title>

    <style>
        /* Base Styles matching SmartAyuda theme */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }

        .dashboard-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #28a745;
            padding-bottom: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 2.2em;
            margin: 0;
        }

        .header p {
            color: #666;
            margin: 5px 0 0 0;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1em;
            border: 2px solid #ccc;
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
            background-color: white;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #28a745;
        }

        .readonly-info {
            background-color: #f8f9fa;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            color: #666;
            font-size: 1.1em;
        }

        /* Action Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-save {
            flex: 1;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s;
        }

        .btn-save:hover {
            background-color: #218838;
        }

        .btn-cancel {
            flex: 1;
            background-color: #dc3545;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s;
        }

        .btn-cancel:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Register New User</h1>
            <p>Link an unassigned card to a new recipient record</p>
        </div>

        <form id="create-user-form" onsubmit="submitRegistrationForm(event)">
            <!-- Card UID (Read-only reference captured from scanner) -->
            <div class="form-group">
                <label>Card UID:</label>
                <div class="readonly-info" id="display-uid">Waiting for scan...</div>
            </div>

            <!-- Name Input Field -->
            <div class="form-group">
                <label for="user-name">Full Name:</label>
                <input type="text" id="user-name" placeholder="Enter full name..." required>
            </div>

            <!-- Address Input Field -->
            <div class="form-group">
                <label for="user-address">Address:</label>
                <input type="text" id="user-address" placeholder="Enter complete address..." required>
            </div>

            <!-- Buttons -->
            <div class="button-group">
                <button type="button" class="btn-cancel" onclick="window.location.href='admin_portal.html'">Cancel</button>
                <button type="submit" class="btn-save">Register & Link</button>
            </div>
        </form>
    </div>

    <script>
        // Check the URL for the '?uid=' parameter passed from the admin portal
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const scannedUid = urlParams.get('uid');

            if (scannedUid) {
                document.getElementById('display-uid').innerText = scannedUid;
            }
        });

        function submitRegistrationForm(event) {
            event.preventDefault(); // Stop the page from reloading immediately

            const userName = document.getElementById('user-name').value;
            const userAddress = document.getElementById('user-address').value;
            const uid = document.getElementById('display-uid').innerText;

            if (uid === "Waiting for scan...") {
                alert("Error: No Card UID provided.");
                return;
            }

            // --- SAVE NEW USER TO DATABASE ---
            fetch('/api/link_card/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    uid: uid,
                    full_name: userName,
                    address: userAddress
                })
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert("New user successfully registered and linked!\nName: " + userName + "\nAddress: " + userAddress + "\nUID: " + uid);
                    window.location.href = 'admin_portal.html';
                } else {
                    alert("Database Error: " + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Network Error: Could not connect to the database.");
            });
        }

        // --- LIVE POLLING LOGIC ---
        function pollScanner() {
            fetch('/api/check_scanner/')
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        // The database caught a scan! Autofill the UID input box.
                        const uidDisplay = document.getElementById('display-uid');
                        if (uidDisplay) {
                            uidDisplay.innerText = data.scan_data.uid;

                            // Optional: Flash the box green to let the user know it worked
                            uidDisplay.style.borderColor = '#28a745';
                            uidDisplay.style.backgroundColor = '#e8f5e9';
                            setTimeout(() => {
                                uidDisplay.style.backgroundColor = '#f8f9fa';
                                uidDisplay.style.borderColor = '#ddd';
                            }, 1000);
                        }
                    }
                })
                .catch(error => console.error('Error checking scanner:', error));
        }

        // Start listening to the backend automatically every 1.5 seconds
        setInterval(pollScanner, 1500);
    </script>

</body>
</html>
