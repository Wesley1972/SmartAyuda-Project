<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartAyuda - Edit User Details</title>

    <style>
        /* Base Styles matching SmartAyuda theme */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 40px 20px;
            color: #333;
        }

        .dashboard-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #ffc107;
            padding-bottom: 15px;
        }

        .header h1 {
            color: #333;
            font-size: 2.2em;
            margin: 0;
        }

        .header p {
            color: #666;
            margin: 5px 0 0 0;
        }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1em;
            border: 2px solid #ccc;
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #ffc107;
        }

        .readonly-info {
            background-color: #f8f9fa;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            color: #666;
            font-size: 1.1em;
        }

        /* Action Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-save {
            flex: 1;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s;
        }

        .btn-save:hover {
            background-color: #218838;
        }

        .btn-cancel {
            flex: 1;
            background-color: #dc3545;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.1em;
            transition: background 0.3s;
        }

        .btn-cancel:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Edit User Information</h1>
            <p>Update user record name and address details</p>
        </div>

        <form id="edit-user-form" onsubmit="submitEditForm(event)">
            <div class="form-group">
                <label>Card UID:</label>
                <div class="readonly-info" id="display-uid">A1B2C3D4</div>
            </div>

            <div class="form-group">
                <label for="user-name">Full Name:</label>
                <input type="text" id="user-name" required>
            </div>

            <div class="form-group">
                <label for="user-address">Address:</label>
                <input type="text" id="user-address" required>
            </div>

            <div class="form-group">
                <label for="user-role">Role:</label>
                <select id="user-role">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="button-group">
                <button type="button" class="btn-cancel" onclick="window.location.href='admin_portal.html'">Cancel</button>
                <button type="submit" class="btn-save">Save Changes</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const urlParams = new URLSearchParams(window.location.search);
            const scannedUid = urlParams.get('uid');

            if (scannedUid) {
                document.getElementById('display-uid').innerText = scannedUid;

                // 1. ASKING DJANGO FOR THE DATA
                // When the page opens, fetch the user's current database profile
                fetch('/api/get_user/?uid=' + scannedUid)
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            // Inject the live database data into the empty input boxes
                            document.getElementById('user-name').value = data.full_name;
                            document.getElementById('user-address').value = data.address;
                            document.getElementById('user-role').value = data.role;
                        }
                    });
            }
        });

        function submitEditForm(event) {
            event.preventDefault();

            const updatedName = document.getElementById('user-name').value;
            const updatedAddress = document.getElementById('user-address').value;
            const updatedRole = document.getElementById('user-role').value;
            const uid = document.getElementById('display-uid').innerText;

            if (!uid || !updatedName || !updatedAddress) {
                alert("Please fill in all required fields.");
                return;
            }

            fetch('/api/update_user/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    uid: uid,
                    full_name: updatedName,
                    address: updatedAddress,
                    role: updatedRole,
                })
            })
            .then(response => response.json())
            .then(data => {

                if (data.status === 'success') {

                    alert("User details successfully updated!");

                    window.location.href = 'admin_portal.html';

                } else {

                    alert("Update failed: " + data.message);

                }

            })
            .catch(error => {
                console.error('Error:', error);
                alert("Something went wrong while saving. Check the browser console.");
            });
        }
    </script>

</body>
</html>
